<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just a Little Wait ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f9a8d4, #c084fc);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .box {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(14px);
      border-radius: 25px;
      padding: 30px;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Secret Unlock Target */
    .photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      cursor: pointer;
      border: 3px solid white;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent; /* Removes blue flash on mobile */
    }

    .photo:active {
      transform: scale(0.92);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    .timer {
      font-size: 20px;
      margin: 15px 0;
      font-weight: bold;
      background: rgba(0,0,0,0.1);
      padding: 10px;
      border-radius: 15px;
    }

    .msg {
      font-size: 15px;
      line-height: 1.6;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="photo" id="tap-unlock">
      <img src="assets/images/anju.jpg" alt="Anju">
    </div>

    <h1>അഞ്ജു ❤️</h1>

    <div class="msg">
      ഒരു ചെറിയ സർപ്രൈസ്…  
      <br>
      നിനക്ക് വേണ്ടി കാത്തിരിക്കുന്നു 🎁
    </div>

    <div class="timer" id="countdown">Loading…</div>
  </div>

 <script>
  // 1. REGULAR TIMER LOGIC
  const openDate = new Date("2026-04-08T00:00:00+05:30").getTime();

  const timer = setInterval(() => {
    const now = new Date().getTime();
    const diff = openDate - now;

    if (diff <= 0) {
      clearInterval(timer);
      window.location.href = "main.html";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerHTML =
      `${days} ദിവസം ${hours} മണിക്കൂർ<br>${minutes} മിനിറ്റ് ${seconds} സെക്കന്റ്`;
  }, 1000);

  // 2. STABLE MOBILE EMERGENCY UNLOCK (7 TAPS)
  let count = 0;
  let lastTap = 0;
  const photo = document.getElementById('tap-unlock');

  // Use 'touchstart' for instant mobile response
  const handleTap = (e) => {
    const now = Date.now();
    
    // If the gap between taps is too long (over 800ms), reset the count
    if (now - lastTap > 800) {
      count = 0;
    }
    
    count++;
    lastTap = now;

    // Visual feedback: brief shrink when tapped
    photo.style.transform = "scale(0.9)";
    setTimeout(() => { photo.style.transform = "scale(1)"; }, 100);

    // If she taps 7 times
    if (count === 7) {
      // Success feedback: Screen flashes white
      document.body.style.background = "#ffffff";
      if (navigator.vibrate) navigator.vibrate([50, 50, 50]); 
      
      setTimeout(() => {
        window.location.href = "main.html";
      }, 300);
    }
  };

  // Add listeners for both touch and click
  photo.addEventListener('touchstart', (e) => {
    e.preventDefault(); // Prevents zooming on fast taps
    handleTap();
  });
  
  photo.addEventListener('click', handleTap);
</script>
</body>
</html>
