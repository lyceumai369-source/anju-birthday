<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just a Little Wait ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f9a8d4, #c084fc);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(14px);
      border-radius: 25px;
      padding: 30px;
      max-width: 400px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin-bottom: 10px;
    }

    .timer {
      font-size: 20px;
      margin: 15px 0;
      font-weight: bold;
    }

    .msg {
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="photo">
      <img src="assets/images/anju.jpg" alt="Anju">
    </div>

    <h1>അഞ്ജു ❤️</h1>

    <div class="msg">
      ഒരു ചെറിയ സർപ്രൈസ്…  
      <br>
      നിനക്ക് വേണ്ടി കാത്തിരിക്കുന്നു 🎁
    </div>

    <div class="timer" id="countdown">Loading…</div>
  </div>

  <script>
    // 🎂 Birthday date (April 8, 2026, 00:00 IST)
    const openDate = new Date("2026-04-08T00:00:00+05:30").getTime();

    const timer = setInterval(() => {
      const now = new Date().getTime();
      const diff = openDate - now;

      if (diff <= 0) {
        clearInterval(timer);
        window.location.href = "main.html";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        `${days} ദിവസം ${hours} മണിക്കൂർ<br>${minutes} മിനിറ്റ് ${seconds} സെക്കന്റ്`;
    }, 1000);

    // 🔐 EMERGENCY UNLOCK (ONLY YOU)
    let secret = "";
    const unlockWord = "broopen"; // you can change this

    document.addEventListener("keydown", (e) => {
      secret += e.key.toLowerCase();

      if (secret.includes(unlockWord)) {
        window.location.href = "main.html";
      }

      if (secret.length > 20) {
        secret = secret.slice(-10);
      }
    });
   // 📱 PHONE EMERGENCY UNLOCK (TAP 7 TIMES)
let tapCount = 0;
const secretPhoto = document.getElementById("secretPhoto");

secretPhoto.addEventListener("click", () => {
  tapCount++;

  if (tapCount === 7) {
    window.location.href = "main.html";
  }

  // reset after some time
  setTimeout(() => {
    tapCount = 0;
  }, 4000);
});


  </script>

</body>
</html>
